name: Deploy Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check deploy configuration
        run: |
          if [ -z "${{ vars.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Set the CLOUDFLARE_ACCOUNT_ID repository variable (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: >
          npx wrangler pages deploy dist
          --project-name vanish
          --branch main
          --commit-hash "${{ github.sha }}"
          --commit-message "${{ github.event.head_commit.message || github.sha }}"
          --commit-dirty=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
